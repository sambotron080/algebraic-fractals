[package]
name = "algebraic-fractals"
version = "0.3.0"
edition = "2021"
description = "Explore algebraic-number fractals and make zoom videos of them"

# src/lib.rs          -> the algfrac library: engine, colouring, density, files, video
# src/main.rs, app/   -> Algebraic Fractals.exe (the explorer and the video window)
# src/bin/algfrac.rs  -> algfrac.exe (command line)

[lib]
name = "algfrac"

[[bin]]
name = "algebraic-fractals"
path = "src/main.rs"

[dependencies]
mp4 = "0.14.0"         # .mp4 muxer (pure Rust)
openh264 = "0.9.9"     # H.264 encoder, compiled from Cisco's OpenH264 source
miniz_oxide = "0.8.9"  # deflate, for compressed PNGs
eframe = "0.31.1"      # the window (egui)
rfd = "0.15"           # native folder and file dialogs
ctrlc = "3.4"          # Ctrl+C in `algfrac video`: stop after the current frame

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
